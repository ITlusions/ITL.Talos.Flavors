name: Build Talos Flavor — ControlPlane Stack

# ════════════════════════════════════════════════════════════════════════════
# Pipeline overview
#
#  1. resolve-extensions → build & push ITL extension OCI images + pre-baked
#                          installer image via ITL.Talos.HardenedOS reusable
#                          workflow.
#
#  2. generate-configs  → generate 3 machineconfig YAMLs (controlplane,
#                         worker-infra, worker-app) by layering base patches
#                         then flavor patches.
#
#  3. stage-configs     → create a DRAFT GitHub Release and upload the 3 raw
#                         machineconfig YAMLs.
#
#  4. build-isos        → run ghcr.io/siderolabs/imager once per role to
#                         produce 3 role-specific bootable ISOs.
#                         No talos.config= is baked in — the USB wizard
#                         injects a machine-specific one-time token URL
#                         (GET /api/v1/config/{token}) after registration.
#                         The MAC-based endpoint (GET /api/v1/config?mac=)
#                         remains available as a secondary fallback.
#
#  5. finalize-release  → upload ISOs + configs; publish release.
#
# Zero-touch provisioning (primary path — USB wizard):
#   1. Boot USB wizard on the machine
#   2. Wizard registers via POST /api/v1/register → gets one-time config URL
#   3. Wizard downloads role ISO, patches GRUB with talos.config=<token-url>
#   4. Talos installs, fetches machineconfig via one-time URL, reboots + joins
# ════════════════════════════════════════════════════════════════════════════

on:
  push:
    tags:
      - 'v*-cpstack'
  workflow_dispatch:
    inputs:
      talos_version:
        description: 'Talos version override (e.g. v1.9.0)'
        required: false
        default: ''
      extra_extensions:
        description: 'Extra OCI extension refs to bake into the ISO (space-separated)'
        required: false
        default: ''
      extension_tag:
        description: 'Extension image tag from ITL.Talos.HardenedOS GHCR (e.g. v1.0.0 or latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  TALOS_VERSION: v1.9.0
  FLAVOR: controlplane-stack
  FLAVOR_DIR: flavors/controlplane-stack
  # GitHub org/user that owns the GHCR packages
  IMAGE_ORG: itlusions
  # ITL Registration Service URL baked into ISO kernel args
  ITL_REG_URL: https://reg.itlusions.com

jobs:
  # ── Step 1: build & push extensions via reusable workflow ──────────────────
  # Extensions are built and published by ITL.Talos.HardenedOS.
  # This calls the reusable workflow directly so the Flavors pipeline always
  # has freshly pushed images available before generating configs and ISOs.
  resolve-extensions:
    name: Build & Push Extensions
    uses: ITlusions/ITL.Talos.HardenedOS/.github/workflows/build-extensions.yaml@main
    with:
      talos_version: ${{ inputs.talos_version }}
      image_tag: ${{ inputs.extension_tag }}
    permissions:
      contents: read
      packages: write

  # ── Step 2: generate Talos configs with all patches layered ─────────────────
  generate-configs:
    name: Generate ControlPlane Stack Configs
    runs-on: ubuntu-latest
    needs: [resolve-extensions]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install talosctl
        run: |
          curl -Lo /usr/local/bin/talosctl \
            https://github.com/siderolabs/talos/releases/download/${{ needs.resolve-extensions.outputs.talos_version }}/talosctl-linux-amd64
          chmod +x /usr/local/bin/talosctl
          talosctl version --client

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Generate base Talos configs
        run: |
          mkdir -p config/generated config/output/${{ env.FLAVOR }}

          talosctl gen config itl-cpstack-cluster \
            https://api.itlusions.com:6443 \
            --output-types controlplane \
            --output config/generated/controlplane.yaml

          talosctl gen config itl-cpstack-cluster \
            https://api.itlusions.com:6443 \
            --output-types worker \
            --output config/generated/worker.yaml

          echo "[OK] Base configs generated"

      - name: Apply base patches (branding → security → network → oidc)
        run: |
          OUT=config/output/${{ env.FLAVOR }}
          CP=config/generated/controlplane.yaml
          WK=config/generated/worker.yaml

          # branding
          yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
            "$CP" config/patches/branding-patch.yaml > "$OUT/cp-01-branded.yaml"
          yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
            "$WK" config/patches/branding-patch.yaml > "$OUT/wk-01-branded.yaml"

          # security hardening
          for f in cp wk; do
            yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
              "$OUT/${f}-01-branded.yaml" config/patches/security-hardening.yaml \
              > "$OUT/${f}-02-security.yaml"
          done

          # network hardening (base)
          for f in cp wk; do
            yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
              "$OUT/${f}-02-security.yaml" config/patches/network-hardening.yaml \
              > "$OUT/${f}-03-network.yaml"
          done

          # oidc (control-plane only)
          yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
            "$OUT/cp-03-network.yaml" config/patches/oidc-patch.yaml \
            > "$OUT/cp-04-oidc.yaml"

          cp "$OUT/wk-03-network.yaml" "$OUT/wk-04-base.yaml"

          echo "[OK] Base patches applied"

      - name: Apply flavor-specific patches
        run: |
          OUT=config/output/${{ env.FLAVOR }}
          FD=${{ env.FLAVOR_DIR }}/patches

          # storage
          for f in cp wk; do
            IN="${f}-04-$([ $f = cp ] && echo oidc || echo base).yaml"
            yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
              "$OUT/$IN" "$FD/cp-storage.yaml" \
              > "$OUT/${f}-05-storage.yaml"
          done

          # networking (Cilium, pod/service CIDRs)
          for f in cp wk; do
            yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
              "$OUT/${f}-05-storage.yaml" "$FD/cp-networking.yaml" \
              > "$OUT/${f}-06-networking.yaml"
          done

          # node labels + kubelet tuning
          for f in cp wk; do
            yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
              "$OUT/${f}-06-networking.yaml" "$FD/cp-node-labels.yaml" \
              > "$OUT/${f}-07-labels.yaml"
          done

          # registry mirrors
          for f in cp wk; do
            yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
              "$OUT/${f}-07-labels.yaml" "$FD/cp-registry.yaml" \
              > "$OUT/${f}-08-registry.yaml"
          done

          # OIDC flavor override (control-plane only — adds inline RBAC manifests)
          yq eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
            "$OUT/cp-08-registry.yaml" "$FD/cp-oidc.yaml" \
            > "$OUT/cp-09-oidc-final.yaml"

          cp "$OUT/wk-08-registry.yaml" "$OUT/wk-09-final-base.yaml"

          echo "[OK] Flavor patches applied"

      - name: Set installer image and finalize configs
        run: |
          INSTALLER_IMAGE="${{ needs.resolve-extensions.outputs.installer_image }}"
          OUT=config/output/${{ env.FLAVOR }}

          # machine.install.image points to the pre-baked installer OCI image.
          # All ITL extensions are already merged in — Talos uses this image
          # both for initial install to disk and for future upgrades.
          yq eval ".machine.install.image = \"${INSTALLER_IMAGE}\"" \
            "$OUT/cp-09-oidc-final.yaml" > "$OUT/controlplane-final.yaml"

          yq eval ".machine.install.image = \"${INSTALLER_IMAGE}\"" \
            "$OUT/wk-09-final-base.yaml" > "$OUT/worker-infra-final.yaml"

          # Split into infra and app worker roles via node label
          cp "$OUT/worker-infra-final.yaml" "$OUT/worker-app-final.yaml"
          yq eval '.machine.nodeLabels["itl.io/role"] = "app"' \
            -i "$OUT/worker-app-final.yaml"
          yq eval '.machine.nodeLabels["itl.io/role"] = "infra"' \
            -i "$OUT/worker-infra-final.yaml"

          echo "[OK] Installer image set; worker configs split into infra + app roles"

      - name: Apply worker role-specific patches
        run: |
          OUT=config/output/${{ env.FLAVOR }}
          FD=${{ env.FLAVOR_DIR }}/patches

          # ── worker-infra: sysctls + hugepages + taints + extra mounts ──────
          # Use talosctl machineconfig patch for proper strategic merge of
          # array fields (kernel.modules, kubelet.extraMounts, etc.).
          talosctl machineconfig patch "$OUT/worker-infra-final.yaml" \
            --patch @"$FD/worker-infra-sysctl.yaml" \
            --output "$OUT/worker-infra-p1.yaml"
          talosctl machineconfig patch "$OUT/worker-infra-p1.yaml" \
            --patch @"$FD/worker-infra-taints.yaml" \
            --output "$OUT/worker-infra-p2.yaml"
          talosctl machineconfig patch "$OUT/worker-infra-p2.yaml" \
            --patch @"$FD/worker-infra-storage.yaml" \
            --output "$OUT/worker-infra-final.yaml"

          # ── worker-app: gVisor RuntimeClass + taints + network tuning ──────
          talosctl machineconfig patch "$OUT/worker-app-final.yaml" \
            --patch @"$FD/worker-app-gvisor.yaml" \
            --output "$OUT/worker-app-p1.yaml"
          talosctl machineconfig patch "$OUT/worker-app-p1.yaml" \
            --patch @"$FD/worker-app-taints.yaml" \
            --output "$OUT/worker-app-p2.yaml"
          talosctl machineconfig patch "$OUT/worker-app-p2.yaml" \
            --patch @"$FD/worker-app-networking.yaml" \
            --output "$OUT/worker-app-final.yaml"

          # Clean up intermediate files
          rm -f "$OUT/worker-infra-p1.yaml" "$OUT/worker-infra-p2.yaml" \
                "$OUT/worker-app-p1.yaml"  "$OUT/worker-app-p2.yaml"

          echo "[OK] Role-specific patches applied (infra: sysctl+taints+storage | app: gvisor+taints+networking)"

      - name: Validate all final configs
        run: |
          OUT=config/output/${{ env.FLAVOR }}
          for f in controlplane-final worker-infra-final worker-app-final; do
            echo "[*] Validating ${f}.yaml..."
            talosctl validate --config "$OUT/${f}.yaml" --mode metal \
              || echo "[!] Validation warnings in ${f}.yaml"
          done
          echo "[OK] Validation complete"

      - name: Copy Helm values overlay into artifact
        run: |
          OUT=config/output/${{ env.FLAVOR }}
          cp ${{ env.FLAVOR_DIR }}/helm-values-overlay.yaml "$OUT/"
          cp -r ${{ env.FLAVOR_DIR }}/manifests "$OUT/"

      - name: Upload config artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talos-configs-${{ env.FLAVOR }}
          path: config/output/${{ env.FLAVOR }}/
          retention-days: 30

  # ── Step 3: stage machineconfigs in a draft release ────────────────────────
  # Creates a draft GitHub Release and uploads the 3 raw machineconfig YAMLs
  # BEFORE the ISOs are built, so we have stable asset download URLs to embed
  # as talos.config= kernel args inside the ISOs.
  stage-configs:
    name: Stage Configs in Draft Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [generate-configs]
    permissions:
      contents: write
    outputs:
      release_id:    ${{ steps.create.outputs.release_id }}
      cp_config_url: ${{ steps.urls.outputs.cp_config_url }}
      wi_config_url: ${{ steps.urls.outputs.wi_config_url }}
      wa_config_url: ${{ steps.urls.outputs.wa_config_url }}

    steps:
      - name: Download config artifacts
        uses: actions/download-artifact@v4
        with:
          name: talos-configs-${{ env.FLAVOR }}
          path: release/

      - name: Create draft GitHub Release
        id: create
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          name: "ITL Talos — ControlPlane Stack ${{ github.ref_name }}"
          body: |
            *Draft — ISOs are being built. This release will be published automatically.*
          files: |
            release/controlplane-final.yaml
            release/worker-infra-final.yaml
            release/worker-app-final.yaml
            release/helm-values-overlay.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve asset download URLs
        id: urls
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          echo "cp_config_url=${BASE}/controlplane-final.yaml"   >> "$GITHUB_OUTPUT"
          echo "wi_config_url=${BASE}/worker-infra-final.yaml"   >> "$GITHUB_OUTPUT"
          echo "wa_config_url=${BASE}/worker-app-final.yaml"     >> "$GITHUB_OUTPUT"

  # ── Step 4: build bootable ISOs via Talos Imager ────────────────────────────
  # The Talos Imager (ghcr.io/siderolabs/imager) pulls extensions from the OCI
  # registry at build time and bakes them into the ISO.
  # A talos.config=<url> kernel arg is embedded so the node automatically
  # fetches and applies its machineconfig on first boot — no manual step needed.
  build-isos:
    name: Build Bootable ISOs
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [resolve-extensions, stage-configs]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Talos Imager
        run: |
          TALOS_VER=${{ needs.resolve-extensions.outputs.talos_version }}
          docker pull ghcr.io/siderolabs/imager:${TALOS_VER}
          echo "[OK] Imager pulled: ${TALOS_VER}"

      - name: Prepare extra extension args
        run: |
          # Write each extra extension ref on its own line for safe consumption
          INPUT="${{ github.event.inputs.extra_extensions }}"
          > extra-extensions.txt
          if [ -n "$INPUT" ]; then
            for ext in $INPUT; do
              trimmed="$(echo "$ext" | xargs)"
              [ -n "$trimmed" ] && echo "$trimmed" >> extra-extensions.txt
            done
          fi
          echo "[*] Extra extensions to bake into all role ISOs:"
          cat extra-extensions.txt || echo "  (none)"

      - name: Build — ControlPlane ISO
        run: |
          TALOS_VER=${{ needs.resolve-extensions.outputs.talos_version }}
          INSTALLER_IMAGE="${{ needs.resolve-extensions.outputs.installer_image }}"
          mkdir -p iso-output

          EXTRA_EXT_ARGS=()
          while IFS= read -r ext; do
            [ -n "$ext" ] && EXTRA_EXT_ARGS+=(--system-extension-image "$ext")
          done < <(cat extra-extensions.txt 2>/dev/null || true)

          # No talos.config= baked in — the USB wizard injects the machine-specific
          # one-time token URL (GET /api/v1/config/{token}) after registration.
          docker run --rm \
            -v "$PWD/iso-output:/out" \
            -e "REGISTRY_AUTH_FILE=/run/containers/auth.json" \
            -v "$HOME/.docker/config.json:/run/containers/auth.json:ro" \
            ghcr.io/siderolabs/imager:${TALOS_VER} \
            iso \
            --arch amd64 \
            --base-installer-image "${INSTALLER_IMAGE}" \
            "${EXTRA_EXT_ARGS[@]}" \
            --extra-kernel-arg "itl.flavor=controlplane-stack" \
            --extra-kernel-arg "itl.role=controlplane" \
            --extra-kernel-arg "itl.reg_url=${{ env.ITL_REG_URL }}"

          mv iso-output/metal-amd64.iso \
             iso-output/itl-cpstack-controlplane-amd64.iso
          sha256sum iso-output/itl-cpstack-controlplane-amd64.iso \
            > iso-output/itl-cpstack-controlplane-amd64.iso.sha256

          echo "[OK] ControlPlane ISO built"

      - name: Build — Worker Infra ISO
        run: |
          TALOS_VER=${{ needs.resolve-extensions.outputs.talos_version }}
          INSTALLER_IMAGE="${{ needs.resolve-extensions.outputs.installer_image }}"

          EXTRA_EXT_ARGS=()
          while IFS= read -r ext; do
            [ -n "$ext" ] && EXTRA_EXT_ARGS+=(--system-extension-image "$ext")
          done < <(cat extra-extensions.txt 2>/dev/null || true)

          docker run --rm \
            -v "$PWD/iso-output:/out" \
            -e "REGISTRY_AUTH_FILE=/run/containers/auth.json" \
            -v "$HOME/.docker/config.json:/run/containers/auth.json:ro" \
            ghcr.io/siderolabs/imager:${TALOS_VER} \
            iso \
            --arch amd64 \
            --base-installer-image "${INSTALLER_IMAGE}" \
            "${EXTRA_EXT_ARGS[@]}" \
            --extra-kernel-arg "itl.flavor=controlplane-stack" \
            --extra-kernel-arg "itl.role=worker-infra" \
            --extra-kernel-arg "itl.reg_url=${{ env.ITL_REG_URL }}"

          mv iso-output/metal-amd64.iso \
             iso-output/itl-cpstack-worker-infra-amd64.iso
          sha256sum iso-output/itl-cpstack-worker-infra-amd64.iso \
            > iso-output/itl-cpstack-worker-infra-amd64.iso.sha256

          echo "[OK] Worker-Infra ISO built"

      - name: Build — Worker App ISO
        run: |
          TALOS_VER=${{ needs.resolve-extensions.outputs.talos_version }}
          INSTALLER_IMAGE="${{ needs.resolve-extensions.outputs.installer_image }}"

          EXTRA_EXT_ARGS=()
          while IFS= read -r ext; do
            [ -n "$ext" ] && EXTRA_EXT_ARGS+=(--system-extension-image "$ext")
          done < <(cat extra-extensions.txt 2>/dev/null || true)

          docker run --rm \
            -v "$PWD/iso-output:/out" \
            -e "REGISTRY_AUTH_FILE=/run/containers/auth.json" \
            -v "$HOME/.docker/config.json:/run/containers/auth.json:ro" \
            ghcr.io/siderolabs/imager:${TALOS_VER} \
            iso \
            --arch amd64 \
            --base-installer-image "${INSTALLER_IMAGE}" \
            "${EXTRA_EXT_ARGS[@]}" \
            --extra-kernel-arg "itl.flavor=controlplane-stack" \
            --extra-kernel-arg "itl.role=worker-app" \
            --extra-kernel-arg "itl.reg_url=${{ env.ITL_REG_URL }}"

          mv iso-output/metal-amd64.iso \
             iso-output/itl-cpstack-worker-app-amd64.iso
          sha256sum iso-output/itl-cpstack-worker-app-amd64.iso \
            > iso-output/itl-cpstack-worker-app-amd64.iso.sha256

          echo "[OK] Worker-App ISO built"

      - name: Build netboot assets
        run: |
          # Use the Talos imager directly with 'kernel' and 'initramfs' subcommands.
          # --base-installer-image reuses the pre-baked installer OCI image — the same
          # image used for ISO builds — so no individual extension pulls are needed.
          TALOS_VER=${{ needs.resolve-extensions.outputs.talos_version }}
          INSTALLER_IMAGE="${{ needs.resolve-extensions.outputs.installer_image }}"
          mkdir -p netboot-assets

          # Reconstruct extra extension args from prep step
          EXTRA_EXT_ARGS=()
          while IFS= read -r ext; do
            [ -n "$ext" ] && EXTRA_EXT_ARGS+=(--system-extension-image "$ext")
          done < <(cat extra-extensions.txt 2>/dev/null || true)

          # ── ControlPlane: branding + security + tpm-register + gvisor + intel-ucode ──
          echo "[*] Building kernel for controlplane..."
          mkdir -p netboot-assets/cpstack-controlplane
          docker run --rm \
            -v "$PWD/netboot-assets/cpstack-controlplane:/out" \
            -v "$HOME/.docker/config.json:/run/containers/auth.json:ro" \
            -e "REGISTRY_AUTH_FILE=/run/containers/auth.json" \
            ghcr.io/siderolabs/imager:${TALOS_VER} \
            kernel --arch amd64

          echo "[*] Building initramfs for controlplane..."
          docker run --rm \
            -v "$PWD/netboot-assets/cpstack-controlplane:/out" \
            -v "$HOME/.docker/config.json:/run/containers/auth.json:ro" \
            -e "REGISTRY_AUTH_FILE=/run/containers/auth.json" \
            ghcr.io/siderolabs/imager:${TALOS_VER} \
            initramfs --arch amd64 \
            --base-installer-image "${INSTALLER_IMAGE}" \
            "${EXTRA_EXT_ARGS[@]}"

          # Rename to standard netboot filenames
          mv netboot-assets/cpstack-controlplane/kernel-amd64       netboot-assets/cpstack-controlplane/vmlinuz
          mv netboot-assets/cpstack-controlplane/initramfs-amd64.xz netboot-assets/cpstack-controlplane/initramfs.xz
          echo "[OK] ControlPlane netboot assets built"

          # ── Workers: branding + security + tpm-register + gvisor (no intel-ucode) ──
          # Both worker roles use the same extension set → build once, copy for the second.
          echo "[*] Building kernel for workers..."
          mkdir -p netboot-assets/_worker-tmp
          docker run --rm \
            -v "$PWD/netboot-assets/_worker-tmp:/out" \
            -v "$HOME/.docker/config.json:/run/containers/auth.json:ro" \
            -e "REGISTRY_AUTH_FILE=/run/containers/auth.json" \
            ghcr.io/siderolabs/imager:${TALOS_VER} \
            kernel --arch amd64

          echo "[*] Building initramfs for workers..."
          docker run --rm \
            -v "$PWD/netboot-assets/_worker-tmp:/out" \
            -v "$HOME/.docker/config.json:/run/containers/auth.json:ro" \
            -e "REGISTRY_AUTH_FILE=/run/containers/auth.json" \
            ghcr.io/siderolabs/imager:${TALOS_VER} \
            initramfs --arch amd64 \
            --base-installer-image "${INSTALLER_IMAGE}" \
            "${EXTRA_EXT_ARGS[@]}"

          for ROLE in worker-infra worker-app; do
            mkdir -p netboot-assets/cpstack-${ROLE}
            cp netboot-assets/_worker-tmp/kernel-amd64       netboot-assets/cpstack-${ROLE}/vmlinuz
            cp netboot-assets/_worker-tmp/initramfs-amd64.xz netboot-assets/cpstack-${ROLE}/initramfs.xz
            echo "[OK] ${ROLE} netboot assets ready"
          done
          rm -rf netboot-assets/_worker-tmp

          echo "[*] Netboot assets summary:"
          find netboot-assets -type f | sort

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talos-isos-${{ env.FLAVOR }}
          path: iso-output/
          retention-days: 7

      - name: Upload netboot assets
        uses: actions/upload-artifact@v4
        with:
          name: netboot-assets-${{ env.FLAVOR }}
          path: netboot-assets/
          retention-days: 30

  # ── Step 5: publish the release with ISOs + config bundle ───────────────────
  finalize-release:
    name: Finalize & Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [stage-configs, build-isos, generate-configs]
    permissions:
      contents: write

    steps:
      - name: Download ISO artifacts
        uses: actions/download-artifact@v4
        with:
          name: talos-isos-${{ env.FLAVOR }}
          path: isos/

      - name: Download config artifacts
        uses: actions/download-artifact@v4
        with:
          name: talos-configs-${{ env.FLAVOR }}
          path: configs/

      - name: Download netboot assets
        uses: actions/download-artifact@v4
        with:
          name: netboot-assets-${{ env.FLAVOR }}
          path: netboot/

      - name: Package config bundle
        run: |
          cd configs
          tar -czf ../itl-cpstack-configs-${{ github.ref_name }}.tar.gz .
          sha256sum ../itl-cpstack-configs-${{ github.ref_name }}.tar.gz \
            > ../itl-cpstack-configs-${{ github.ref_name }}.tar.gz.sha256

      - name: Upload ISOs + config bundle; publish release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            isos/*.iso
            isos/*.iso.sha256
            itl-cpstack-configs-${{ github.ref_name }}.tar.gz
            itl-cpstack-configs-${{ github.ref_name }}.tar.gz.sha256
            netboot/cpstack-*/**
          body: |
            # ITL Talos — ControlPlane Stack ${{ github.ref_name }}

            Custom Talos OS flavor for the ITL ControlPlane Stack.
            Extensions are baked into each ISO via the pre-baked installer OCI image.
            Nodes are provisioned by the USB wizard, which injects a machine-specific
            one-time config URL (`GET /api/v1/config/{token}`) into each ISO before install.

            ## ISOs (download for USB wizard)

            | File | Role |
            |------|------|
            | `itl-cpstack-controlplane-amd64.iso` | Control-plane nodes |
            | `itl-cpstack-worker-infra-amd64.iso` | Stateful workers (PostgreSQL, Neo4j, Redis) |
            | `itl-cpstack-worker-app-amd64.iso`   | Stateless workers (API Gateway, Providers) |

            ## Extensions baked into each ISO

            | Extension | Purpose |
            |-----------|---------|
            | `itl-talos-hardened-os-branding` | ITL boot branding |
            | `itl-talos-hardened-os-security` | Hardened sysctl/audit/modprobe |
            | `itl-talos-tpm-register` | TPM enrollment extension |
            | `siderolabs/gvisor` | gVisor container sandbox |
            | `siderolabs/intel-ucode` | Intel microcode |

            ## Zero-touch provisioning

            ```bash
            # 1. Boot the USB wizard ISO on the machine to provision
            # 2. Wizard registers the machine → receives one-time config URL
            # 3. Wizard downloads the correct role ISO and patches talos.config=<token-url>
            # 4. Talos installs, fetches machineconfig, reboots and joins the cluster

            # Bootstrap (first control-plane node only)
            talosctl bootstrap --nodes <cp-ip>
            ```

            ## Checksums
            ```bash
            sha256sum -c itl-cpstack-controlplane-amd64.iso.sha256
            sha256sum -c itl-cpstack-worker-infra-amd64.iso.sha256
            sha256sum -c itl-cpstack-worker-app-amd64.iso.sha256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Notify ───────────────────────────────────────────────────────────────────
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    if: always()
    needs: [resolve-extensions, generate-configs, build-isos]
    steps:
      - name: Log completion
        run: |
          echo "=== ITL Talos ControlPlane Stack Flavor Build ==="
          echo "Flavor     : ${{ env.FLAVOR }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Tag        : ${{ github.ref_name }}"
          echo "Generic ISO: itl-cpstack-generic-*.iso (single image for all roles)"
          echo "Config URL : ${{ env.ITL_REG_URL }}/api/v1/config (MAC-based lookup)"
          echo "Run URL    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
