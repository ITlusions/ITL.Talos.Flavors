# Bootstrap Manifest: HorizontalPodAutoscaler defaults for app-tier services
#
# Configures HPA for stateless app-tier services so they scale out under load
# and scale back in when idle.
#
# Policy (all services):
#   minReplicas : 2  — always 2 replicas for HA (survives 1 node failure)
#   maxReplicas : 10 — hard ceiling; adjust per service based on capacity
#   CPU target  : 70% of requested CPU
#
# Prerequisites:
#   - metrics-server must be running (installed by default in Talos clusters)
#   - Each Deployment must have resources.requests.cpu set
#
# Services covered:
#   itl-api-gateway, itl-core-provider, itl-identity-provider,
#   itl-iam-provider, itl-dashboard, itl-portal
#
# Update the Deployment names to match your Helm release names.
#
# Apply after cluster bootstrap:
#   kubectl apply -f manifests/12-hpa-defaults.yaml

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-api-gateway
  namespace: itl-controlplane
  labels:
    itl.io/managed-by: talos-flavor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: itl-api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

