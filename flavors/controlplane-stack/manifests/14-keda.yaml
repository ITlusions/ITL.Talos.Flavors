# Bootstrap Manifest: KEDA — RabbitMQ-driven autoscaling for app-tier consumers
#
# KEDA (Kubernetes Event-Driven Autoscaling) scales Deployment replicas based
# on RabbitMQ queue depth instead of CPU.  This is more accurate for async
# workloads like task processors, event consumers, and background jobs.
#
# Architecture:
#   RabbitMQ queue depth → KEDA RabbitMQTrigger → ScaledObject → HPA
#   (KEDA replaces the HPA defined in 12-hpa-defaults.yaml for scaled objects)
#
# Prerequisites:
#   - KEDA installed (see install command below)
#   - RabbitMQ reachable at rabbitmq.itl-controlplane.svc.cluster.itlusions.local
#   - Secret "keda-rabbitmq-secret" in namespace itl-controlplane
#
# Create the RabbitMQ secret:
#   kubectl create secret generic keda-rabbitmq-secret \
#     --namespace itl-controlplane \
#     --from-literal host="amqp://<user>:<password>@rabbitmq.itl-controlplane.svc:5672/"
#
# Install KEDA:
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm upgrade --install keda kedacore/keda \
#     --namespace keda \
#     --create-namespace \
#     --version 2.x
#
# Apply after KEDA and RabbitMQ are running:
#   kubectl apply -f manifests/14-keda.yaml

---
# Secret reference: KEDA authenticates to RabbitMQ via this TriggerAuthentication.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  namespace: itl-controlplane
  labels:
    itl.io/managed-by: talos-flavor
spec:
  secretTargetRef:
    - parameter: host
      name: keda-rabbitmq-secret
      key: host

---
# ScaledObject: scale itl-core-provider based on its task queue depth.
# Scales from 2 replicas (idle) to 20 (peak) when queue > 10 messages/replica.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: scaledobject-core-provider
  namespace: itl-controlplane
  labels:
    itl.io/managed-by: talos-flavor
spec:
  scaleTargetRef:
    name: itl-core-provider
  minReplicaCount: 2
  maxReplicaCount: 20
  cooldownPeriod: 60
  pollingInterval: 10
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: itl.core.tasks
        mode: QueueLength
        value: "10"
      authenticationRef:
        name: rabbitmq-trigger-auth

---
# ScaledObject: scale itl-iam-provider based on IAM event queue depth.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: scaledobject-iam-provider
  namespace: itl-controlplane
  labels:
    itl.io/managed-by: talos-flavor
spec:
  scaleTargetRef:
    name: itl-iam-provider
  minReplicaCount: 2
  maxReplicaCount: 15
  cooldownPeriod: 60
  pollingInterval: 10
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: itl.iam.events
        mode: QueueLength
        value: "10"
      authenticationRef:
        name: rabbitmq-trigger-auth
