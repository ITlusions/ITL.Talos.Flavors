# Talos Flavor Patch: Network Tuning for worker-app nodes
#
# Applied ONLY to worker-app-final.yaml.
#
# App nodes front the ITL API gateway and multiple REST provider services.
# Under load they handle thousands of short-lived HTTP/gRPC connections.
# These kernel parameters ensure the network stack does not become the
# bottleneck.
#
# Parameters explained:
#   nf_conntrack_max       — conntrack table size; default ~65536 is exhausted
#                            by the gateway under load (each proxied connection
#                            creates two entries: inbound + outbound).
#   ip_local_port_range    — expands the ephemeral port range for outbound
#                            connections from the gateway to backends.
#   rmem_max / wmem_max    — maximum socket receive/send buffer (128 MiB).
#                            The OS auto-tunes within this ceiling.
#   tcp_max_syn_backlog    — SYN queue depth per socket; protects against
#                            SYN flood and slow TLS handshakes.
#   tcp_slow_start_after_idle — disable slow-start after idle for long-lived
#                            keep-alive connections (HTTP/2, gRPC streams).

machine:
  sysctls:
    # ── Conntrack ───────────────────────────────────────────────────────
    net.netfilter.nf_conntrack_max: "524288"
    net.netfilter.nf_conntrack_tcp_timeout_established: "300"
    net.netfilter.nf_conntrack_tcp_timeout_time_wait: "30"

    # ── TCP / socket buffers ────────────────────────────────────────────
    net.ipv4.ip_local_port_range: "1024 65535"
    net.core.rmem_max: "134217728"
    net.core.wmem_max: "134217728"
    net.core.netdev_max_backlog: "16384"
    net.ipv4.tcp_max_syn_backlog: "8096"
    net.ipv4.tcp_slow_start_after_idle: "0"
    net.ipv4.tcp_tw_reuse: "1"
